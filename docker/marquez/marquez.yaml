db:
  driverClass: org.postgresql.Driver
  url: jdbc:postgresql://postgres:5432/marquez
  user: airflow
  password: airflow
  maxSize: 8
  minSize: 2
  checkConnectionOnBorrow: true
  checkConnectionOnConnect: true
  validationQuery: "SELECT 1"

server:
  type: default
  applicationConnectors:
    - type: http
      port: 5000
  adminConnectors:
    - type: http
      port: 5001

logging:
  level: INFO
  appenders:
    - type: console
      threshold: ALL
      target: stdout
      logFormat: "%-5p [%d{ISO8601,UTC}] %c: %m%n%ex"
