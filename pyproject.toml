[tool.poetry]
name = "neuralretail"
version = "1.0.0"
description = "Amdox NeuralRetail AI Sales Intelligence Platform"
authors = ["Amdox Data Science <data-science@amdox.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
pandas = "2.2.0"
numpy = "1.26.0"
polars = "0.20.0"
scikit-learn = "1.4.0"
xgboost = "<2.1.0"
lightgbm = "4.3.0"
torch = "2.3.0"
pytorch-lightning = "2.3.0"
pytorch-forecasting = "^1.4.0"
prophet = "^1.1.0"
shap = "^0.43.0"
lime = "^0.2.0"
captum = "0.7.0"
dowhy = "^0.13.0"
econml = "^0.15.0"
optuna = "3.6.0"
ray = {extras = ["tune"], version = "2.32.0"}
imbalanced-learn = "0.12.0"
pyspark = "3.5.0"
delta-spark = "3.0.0"
great-expectations = "0.18.0"
soda-core-spark = "^3.0.0"
feast = "0.40.0"
openlineage-airflow = "1.18.0"
apache-airflow = "2.9.0"
apache-airflow-providers-postgres = "*"
apache-airflow-providers-redis = "*"
apache-airflow-providers-slack = "*"
mlflow = "2.13.0"
evidently = "^0.4.25"
fastapi = "0.111.0"
uvicorn = {extras = ["standard"], version = "0.29.0"}
pydantic = "^2.5.0"
pydantic-settings = "2.11.0"
python-jose = {extras = ["cryptography"], version = "3.3.0"}
passlib = {extras = ["bcrypt"], version = "1.7.4"}
redis = "5.0.0"
sqlalchemy = "^1.4.36"
psycopg2-binary = "2.9.9"
httpx = "0.27.0"
streamlit = "1.35.0"
plotly = "5.22.0"
streamlit-authenticator = "0.3.2"
reportlab = "4.2.0"
openpyxl = "3.1.2"
ydata-profiling = "4.7.0"
hvac = "2.1.0"
cryptography = "42.0.0"
setuptools = "^82.0.1"
pyarrow = "<16"
requests = "^2.33.1"
python-multipart = "^0.0.27"

[tool.poetry.group.dev.dependencies]
pytest = "8.2.0"
pytest-asyncio = "0.23.0"
pytest-cov = "5.0.0"
ruff = "0.4.0"
black = "24.4.0"
moto = {extras = ["s3"], version = "5.0.0"}
locust = "2.28.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100
target-version = ['py312']